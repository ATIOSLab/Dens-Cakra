components:
  securitySchemes:
    betterAuthCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Actual cookie name follows Better Auth deployment configuration.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    RequestId:
      name: X-Request-Id
      in: header
      schema:
        type: string
  schemas:
    ApiSuccess:
      type: object
      required:
      - success
      - data
      - requestId
      - timestamp
      properties:
        success:
          type: boolean
          enum:
          - true
        data:
          type: object
          additionalProperties: true
        message:
          type: string
        meta:
          type: object
          additionalProperties: true
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    ApiError:
      type: object
      required:
      - success
      - error
      - requestId
      - timestamp
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: array
              items:
                type: object
                additionalProperties: true
            details:
              type: object
              additionalProperties: true
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    OperationPayload:
      type: object
      description: Operation-specific shape is described in x-request-contract and the Markdown API Contract.
      additionalProperties: true
    GeoJsonFeatureCollection:
      type: object
      required:
      - type
      - features
      properties:
        type:
          type: string
          enum:
          - FeatureCollection
        features:
          type: array
          items:
            type: object
            additionalProperties: true
  responses:
    Success:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiSuccess'
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found or masked by scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Conflict or invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unprocessable:
      description: Business rule violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unavailable:
      description: Dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
