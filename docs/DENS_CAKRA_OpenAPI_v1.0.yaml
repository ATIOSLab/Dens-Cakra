openapi: 3.0.3
info:
  title: DENS CAKRA Domain API
  version: 1.0.0
  description: Machine-readable scaffold for the DENS CAKRA domain API. Better Auth routes are mounted separately. The Markdown
    API Contract is authoritative for detailed request, response, query logic, and business rules.
servers:
- url: /api/v1
tags:
- name: 01. Identity Context & Authorization
  description: Foundation module
- name: 02. User Provisioning & Access Administration
  description: Foundation module
- name: 03. Roles, Permissions & Policies
  description: Foundation module
- name: 04. Organization Structure
  description: Foundation module
- name: 05. Positions & Assignments
  description: Foundation module
- name: 06. Administrative Areas & Spatial Services
  description: Foundation module
- name: 07. File Assets
  description: Foundation module
- name: 08. Directives
  description: Operational Core module
- name: 09. UUK/STR
  description: Operational Core module
- name: 10. Tasks & Execution Cascade
  description: Operational Core module
- name: 11. Jaring Management
  description: Operational Core module
- name: 12. WhatsApp Intake & Routing
  description: Operational Core module
- name: 13. Baket
  description: Operational Core module
- name: 14. Formal Verification
  description: Operational Core module
- name: 15. Analysis Workspace
  description: Intelligence Processing module
- name: 16. Product Types & Templates
  description: Intelligence Processing module
- name: 17. Intelligence Products
  description: Intelligence Processing module
- name: 18. Approval Workflow
  description: Intelligence Processing module
- name: 19. Product Distribution
  description: Intelligence Processing module
- name: 20. Dashboard & Geospatial Analytics
  description: Decision Support module
- name: 21. Emergency Incidents
  description: Decision Support module
- name: 22. Alerts
  description: Decision Support module
- name: 23. Notifications
  description: Foundation module
- name: 24. Audit & Compliance
  description: Foundation module
- name: 25. Personnel Location
  description: Decision Support module
- name: 26. Integration Administration
  description: Foundation module
- name: 27. System Administration & Reference Data
  description: Foundation module
security:
- betterAuthCookie: []
paths:
  /me:
    get:
      tags:
      - 01. Identity Context & Authorization
      operationId: apiCtx001
      summary: Ambil identitas dan profil pengguna aktif
      description: 'Response contract: MeResponse'
      x-operation-id: API-CTX-001
      x-permission: authenticated
      x-request-contract: 'Tidak ada body. Query opsional: include=primaryAssignment,unit,areaScopes'
      x-response-contract: MeResponse
      x-query-logic: Resolve Better Auth session; join User→UserProfile→primary active PositionAssignment→Position→Role→OrganizationUnit.
      x-business-rules: Tolak 401 jika session invalid; 423 jika banned/locked; 403 jika profile bukan ACTIVE.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /me/authorization-context:
    get:
      tags:
      - 01. Identity Context & Authorization
      operationId: apiCtx002
      summary: Ambil konteks authorization efektif
      description: 'Response contract: AuthorizationContextResponse'
      x-operation-id: API-CTX-002
      x-permission: authenticated
      x-request-contract: Tidak ada body
      x-response-contract: AuthorizationContextResponse
      x-query-logic: Hitung coarse auth role, domain role, permission set, command branch, unit ancestors, area scopes, clearance
        rank.
      x-business-rules: Response tidak boleh memuat secret permission implementation details di luar kebutuhan UI.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /me/permissions:
    get:
      tags:
      - 01. Identity Context & Authorization
      operationId: apiCtx003
      summary: Ambil permission code efektif
      description: 'Response contract: PermissionListResponse'
      x-operation-id: API-CTX-003
      x-permission: authenticated
      x-request-contract: 'Query: resourceType?, resourceId?'
      x-response-contract: PermissionListResponse
      x-query-logic: Join RolePermission; jika resource diberikan, evaluasi ownership, org scope, area scope, classification
        dan workflow membership.
      x-business-rules: Permission UI hanya hint; backend tetap wajib mengotorisasi setiap endpoint.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /me/area-scopes:
    get:
      tags:
      - 01. Identity Context & Authorization
      operationId: apiCtx004
      summary: Ambil wilayah yang dapat diakses pengguna
      description: 'Response contract: AreaScopeListResponse'
      x-operation-id: API-CTX-004
      x-permission: authenticated
      x-request-contract: 'Query: includeDescendants=false|true, level?'
      x-response-contract: AreaScopeListResponse
      x-query-logic: Baca PositionAreaScope aktif; perluas melalui AdministrativeAreaClosure jika includeDescendants=true.
      x-business-rules: Hanya active assignment dan scope dengan validUntil NULL/masih berlaku.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /me/revoke-other-sessions:
    post:
      tags:
      - 01. Identity Context & Authorization
      operationId: apiCtx005
      summary: Cabut semua session lain
      description: 'Response contract: ActionResultResponse'
      x-operation-id: API-CTX-005
      x-permission: authenticated
      x-request-contract: '{"reason":"string optional"}'
      x-response-contract: ActionResultResponse
      x-query-logic: Delegasikan ke Better Auth session revocation; pertahankan session saat ini.
      x-business-rules: Catat AUTH.REVOKE_OTHER_SESSIONS pada AuditLog; idempotent.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationPayload'
            example:
              _contract: '{"reason":"string optional"}'
  /user-profiles:
    get:
      tags:
      - 02. User Provisioning & Access Administration
      operationId: apiUsr001
      summary: Daftar user profile
      description: 'Response contract: Paged<UserProfileSummary>'
      x-operation-id: API-USR-001
      x-permission: user.read
      x-request-contract: 'Query: page,limit,search,status,roleCode,positionCode,unitId,areaId,includeArchived=false'
      x-response-contract: Paged<UserProfileSummary>
      x-query-logic: Filter profile; join primary assignment. areaId menggunakan closure descendant match. Default deletedAt
        IS NULL.
      x-business-rules: Admin melihat seluruh; pimpinan hanya subordinate chain jika diberi permission.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /user-profiles/provision:
    post:
      tags:
      - 02. User Provisioning & Access Administration
      operationId: apiUsr002
      summary: Provision akun, profile, jabatan dan scope secara atomik
      description: 'Response contract: 201 UserProfileDetail'
      x-operation-id: API-USR-002
      x-permission: user.provision
      x-request-contract: '{"auth":{"name":"...","email":"...","password":"...","role":"field_officer"},"profile":{"username":"...","fullName":"...","phone":"...","clearanceLevel":"TERBATAS"},"assignment":{"positionId":"uuid","validFrom":"ISO"},"areaScopeIds":["uuid"]}'
      x-response-contract: 201 UserProfileDetail
      x-query-logic: 'Transaction: create Better Auth user→UserProfile PENDING→validate role-position→create assignment→create
        scopes→set ACTIVE→revoke initial stale sessions if any.'
      x-business-rules: Email/username unique; auth role harus match RoleCode assignment; tidak ada public self-registration;
        Idempotency-Key wajib.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationPayload'
            example:
              _contract: '{"auth":{"name":"...","email":"...","password":"...","role":"field_officer"},"profile":{"username":"...","fullName":"...","phone":"...","clearanceLevel":"TERBATAS"},"assignment":{"positionId":"uuid","validFrom":"ISO"},"areaScopeIds":["uuid"]}'
  /user-profiles/{userProfileId}:
    get:
      tags:
      - 02. User Provisioning & Access Administration
      operationId: apiUsr003
      summary: Detail user profile
      description: 'Response contract: UserProfileDetail'
      x-operation-id: API-USR-003
      x-permission: user.read
      x-request-contract: 'Path: userProfileId; Query: include=assignments,scopes,auditSummary'
      x-response-contract: UserProfileDetail
      x-query-logic: Load profile dan assignment history dengan access scope.
      x-business-rules: Resource di luar command chain dikembalikan 404 untuk mencegah enumeration.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: userProfileId
        in: path
        required: true
        schema:
          type: string
        description: 'Path identifier: userProfileId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      tags:
      - 02. User Provisioning & Access Administration
      operationId: apiUsr004
      summary: Ubah metadata profile
      description: 'Response contract: UserProfileDetail'
      x-operation-id: API-USR-004
      x-permission: user.update
      x-request-contract: '{"username?":"...","fullName?":"...","phone?":"...","clearanceLevel?":"RAHASIA"}'
      x-response-contract: UserProfileDetail
      x-query-logic: Update field mutable saja; clearance change memerlukan permission khusus dan audit before/after.
      x-business-rules: Tidak boleh mengubah auth role, status, assignment atau scope melalui endpoint ini.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: userProfileId
        in: path
        required: true
        schema:
          type: string
        description: 'Path identifier: userProfileId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationPayload'
            example:
              _contract: '{"username?":"...","fullName?":"...","phone?":"...","clearanceLevel?":"RAHASIA"}'
  /user-profiles/{userProfileId}/activate:
    post:
      tags:
      - 02. User Provisioning & Access Administration
      operationId: apiUsr005
      summary: Aktifkan profile setelah provisioning
      description: 'Response contract: ActionResultResponse'
      x-operation-id: API-USR-005
      x-permission: user.activate
      x-request-contract: '{"reason":"string"}'
      x-response-contract: ActionResultResponse
      x-query-logic: Pastikan ada primary active assignment, role match, position aktif, area scope memenuhi policy; set status
        ACTIVE.
      x-business-rules: 409 jika sudah ACTIVE; 422 jika provisioning belum lengkap.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: userProfileId
        in: path
        required: true
        schema:
          type: string
        description: 'Path identifier: userProfileId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationPayload'
            example:
              _contract: '{"reason":"string"}'
  /user-profiles/{userProfileId}/suspend:
    post:
      tags:
      - 02. User Provisioning & Access Administration
      operationId: apiUsr006
      summary: Suspend akses operasional
      description: 'Response contract: ActionResultResponse'
      x-operation-id: API-USR-006
      x-permission: user.suspend
      x-request-contract: '{"reason":"string","until":"ISO optional","revokeSessions":true}'
      x-response-contract: ActionResultResponse
      x-query-logic: Set profile SUSPENDED, optional operational lock, revoke sessions; assignment history tidak dihapus.
      x-business-rules: Reason wajib; tidak boleh suspend diri sendiri kecuali break-glass policy.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: userProfileId
        in: path
        required: true
        schema:
          type: string
        description: 'Path identifier: userProfileId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationPayload'
            example:
              _contract: '{"reason":"string","until":"ISO optional","revokeSessions":true}'
  /user-profiles/{userProfileId}/archive:
    post:
      tags:
      - 02. User Provisioning & Access Administration
      operationId: apiUsr007
      summary: Arsipkan personel
      description: 'Response contract: ActionResultResponse'
      x-operation-id: API-USR-007
      x-permission: user.archive
      x-request-contract: '{"reason":"string","effectiveAt":"ISO"}'
      x-response-contract: ActionResultResponse
      x-query-logic: Close all active assignments/scopes; status ARCHIVED; deletedAt opsional sesuai kebijakan; revoke sessions.
      x-business-rules: Tidak melakukan hard delete.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: userProfileId
        in: path
        required: true
        schema:
          type: string
        description: 'Path identifier: userProfileId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationPayload'
            example:
              _contract: '{"reason":"string","effectiveAt":"ISO"}'
  /user-profiles/{userProfileId}/lock:
    post:
      tags:
      - 02. User Provisioning & Access Administration
      operationId: apiUsr008
      summary: Operational security lock
      description: 'Response contract: ActionResultResponse'
      x-operation-id: API-USR-008
      x-permission: user.lock
      x-request-contract: '{"reason":"string","lockedUntil":"ISO optional"}'
      x-response-contract: ActionResultResponse
      x-query-logic: Set operationalLockedAt/reason/until dan revoke sessions.
      x-business-rules: 423 untuk akses berikutnya; semua lock harus diaudit.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: userProfileId
        in: path
        required: true
        schema:
          type: string
        description: 'Path identifier: userProfileId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationPayload'
            example:
              _contract: '{"reason":"string","lockedUntil":"ISO optional"}'
  /user-profiles/{userProfileId}/unlock:
    post:
      tags:
      - 02. User Provisioning & Access Administration
      operationId: apiUsr009
      summary: Lepas operational lock
      description: 'Response contract: ActionResultResponse'
      x-operation-id: API-USR-009
      x-permission: user.unlock
      x-request-contract: '{"reason":"string"}'
      x-response-contract: ActionResultResponse
      x-query-logic: Clear operational lock fields; tidak otomatis mengubah SUSPENDED menjadi ACTIVE.
      x-business-rules: Audit wajib.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: userProfileId
        in: path
        required: true
        schema:
          type: string
        description: 'Path identifier: userProfileId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationPayload'
            example:
              _contract: '{"reason":"string"}'
  /user-profiles/{userProfileId}/change-primary-assignment:
    post:
      tags:
      - 02. User Provisioning & Access Administration
      operationId: apiUsr010
      summary: Mutasi jabatan utama
      description: 'Response contract: PositionAssignmentDetail'
      x-operation-id: API-USR-010
      x-permission: assignment.transfer
      x-request-contract: '{"newPositionId":"uuid","areaScopeIds":["uuid"],"effectiveAt":"ISO","reason":"string"}'
      x-response-contract: PositionAssignmentDetail
      x-query-logic: 'Single transaction: validate branch/reporting line→close old assignment/scopes→create new assignment/scopes→sync
        Better Auth role→revoke sessions.'
      x-business-rules: Tidak boleh menghasilkan dua primary assignment aktif; Idempotency-Key wajib.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: userProfileId
        in: path
        required: true
        schema:
          type: string
        description: 'Path identifier: userProfileId'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationPayload'
            example:
              _contract: '{"newPositionId":"uuid","areaScopeIds":["uuid"],"effectiveAt":"ISO","reason":"string"}'
  /user-profiles/{userProfileId}/assignments:
    get:
      tags:
      - 02. User Provisioning & Access Administration
      operationId: apiUsr011
