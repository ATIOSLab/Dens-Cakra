# Dokploy backend-only compose for DENS CAKRA.
# Use Dokploy Domains UI for routing instead of hardcoding Traefik labels here.

services:
  dens-cakra-be:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3001}
      # Redis is part of this production compose; keep cache enabled unless
      # operators explicitly disable it during incident recovery.
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_PREFIX: ${CACHE_PREFIX:-dens-cakra}
      CACHE_DEFAULT_TTL_MS: ${CACHE_DEFAULT_TTL_MS:-60000}
      REDIS_URL: ${REDIS_URL}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-1500}
      REDIS_OPERATION_TIMEOUT_MS: ${REDIS_OPERATION_TIMEOUT_MS:-250}
      # Keep container storage paths absolute so Dokploy volume mounts never
      # break when UI/.env values use local relative paths like ./storage.
      LOCAL_STORAGE_ROOT: /app/storage
      # Keep WhatsApp credentials on a named volume so image updates do not
      # force operators to scan QR again.
      WHATSAPP_AUTH_ROOT: /app/wa_auth
      WHATSAPP_ALLOW_SESSION_RESET: ${WHATSAPP_ALLOW_SESSION_RESET:-false}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      RUN_SEED_ON_STARTUP: ${RUN_SEED_ON_STARTUP:-false}
      RUN_JAKARTA_SEED_ON_STARTUP: ${RUN_JAKARTA_SEED_ON_STARTUP:-false}
      RUN_JAKARTA_JARING_IMPORT_ON_STARTUP: ${RUN_JAKARTA_JARING_IMPORT_ON_STARTUP:-false}
      WAIT_FOR_DB_TIMEOUT_MS: ${WAIT_FOR_DB_TIMEOUT_MS:-60000}
      WAIT_FOR_DB_INTERVAL_MS: ${WAIT_FOR_DB_INTERVAL_MS:-2000}
    volumes:
      - dens_cakra_storage:/app/storage
      - dens_cakra_wa_auth:/app/wa_auth
    expose:
      - '${PORT:-3001}'
    healthcheck:
      test: ['CMD', 'node', 'docker/healthcheck.mjs']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  dens-cakra-redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}
    command:
      - sh
      - -c
      - >-
        exec redis-server --save "" --appendonly no
        --maxmemory 256mb --maxmemory-policy allkeys-lru
        --requirepass "$${REDIS_PASSWORD}"
    expose:
      - '6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  dens_cakra_storage:
  dens_cakra_wa_auth:
