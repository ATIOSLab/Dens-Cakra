name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters
      EMAIL_FROM: ci@example.invalid
      SMTP_HOST: smtp.example.invalid
      SMTP_USER: ci
      SMTP_PASS: ci
    defaults:
      run:
        working-directory: apps/be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/be/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/fe/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run check
